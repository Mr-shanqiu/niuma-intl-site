<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Corporate Cattle Merit — choose your language</title>
  <meta name="description" content="Choose a language to visit Corporate Cattle Merit: a quiet, fully offline desktop companion available in English, Traditional Chinese and Japanese.">
  <link rel="canonical" href="https://merit.zqscreen.cn/en/">
  <meta name="theme-color" content="#f5f5f1">
  <link rel="icon" href="favicon.svg">
  <link rel="alternate" hreflang="en" href="https://merit.zqscreen.cn/en/">
  <link rel="alternate" hreflang="zh-Hant" href="https://merit.zqscreen.cn/zh-Hant/">
  <link rel="alternate" hreflang="ja" href="https://merit.zqscreen.cn/ja/">
  <link rel="alternate" hreflang="x-default" href="https://merit.zqscreen.cn/en/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Corporate Cattle Merit">
  <meta property="og:title" content="Corporate Cattle Merit — choose your language">
  <meta property="og:description" content="A quiet, fully offline desktop companion available in English, Traditional Chinese and Japanese.">
  <meta property="og:url" content="https://merit.zqscreen.cn/en/">
  <meta property="og:image" content="https://merit.zqscreen.cn/og-image.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .landing {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding-block: 64px;
    }
    .landing-inner { width: min(640px, 100%); text-align: center; }
    .landing-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--accent);
      font-size: 30px;
      font-weight: 600;
    }
    .landing h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 600; margin: 0 0 10px; letter-spacing: -0.01em; }
    .landing p.lead { color: var(--muted); margin: 0 0 40px; }
    .lang-grid { display: grid; gap: 14px; grid-template-columns: repeat(3, 1fr); }
    .lang-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 22px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      text-decoration: none;
      color: var(--ink);
      background: var(--paper);
      transition: border-color .2s ease, transform .2s ease, background-color .2s ease;
    }
    .lang-card:hover { border-color: var(--accent); background: var(--surface); }
    .lang-card strong { font-size: 17px; font-weight: 600; }
    .lang-card span { color: var(--muted); font-size: 13px; }
    .landing-foot { margin-top: 40px; color: var(--muted); font-size: 13px; }
    .landing-foot a { color: inherit; }
    @media (max-width: 560px) { .lang-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="landing shell">
    <div class="landing-inner">
      <span class="landing-mark" aria-hidden="true">功</span>
      <h1>Corporate Cattle Merit</h1>
      <p class="lead">A quiet, fully offline desktop companion.<br>Choose your language to continue.</p>
      <nav class="lang-grid" aria-label="Choose your language">
        <a class="lang-card" href="en/index.html" hreflang="en" lang="en">
          <strong>English</strong>
          <span>Continue in English</span>
        </a>
        <a class="lang-card" href="zh-Hant/index.html" hreflang="zh-Hant" lang="zh-Hant">
          <strong>繁體中文</strong>
          <span>以繁體中文繼續</span>
        </a>
        <a class="lang-card" href="ja/index.html" hreflang="ja" lang="ja">
          <strong>日本語</strong>
          <span>日本語で続ける</span>
        </a>
      </nav>
      <p class="landing-foot">
        © 2026 Corporate Cattle Merit · Sold via Paddle.com ·
        <a href="https://x.com/shanqiuwong" rel="noopener noreferrer">X @Shanqiuwong</a>
      </p>
    </div>
  </main>
  <script>
    /* Progressive enhancement: send visitors to their language on first entry.
       Static links above remain the fallback for no-JS crawlers and users. */
    (function () {
      try {
        if (location.search.indexOf("stay") !== -1) return;
        var saved = localStorage.getItem("ccm_lang");
        var pick = null;
        if (saved === "en" || saved === "zh-Hant" || saved === "ja") {
          pick = saved;
        } else {
          var n = (navigator.language || "en").toLowerCase();
          if (n.indexOf("ja") === 0) pick = "ja";
          else if (n.indexOf("zh") === 0) pick = "zh-Hant";
          else if (n.indexOf("en") === 0) pick = "en";
        }
        if (pick) location.replace(pick + "/index.html");
      } catch (e) {}
    })();
  </script>
</body>
</html>
